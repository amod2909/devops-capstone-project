[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-package=service

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[flake8]
max-line-length = 127
max-complexity = 10
per-file-ignores =
    */__init__.py: F401, E402
exclude =
    .git,
    __pycache__,
    docs,
    venv,
    .venv

[pylint]
max-line-length = 127
disable =
    C0114, # missing-module-docstring
    C0115, # missing-class-docstring
    C0116, # missing-function-docstring
    R0903  # too-few-public-methods
